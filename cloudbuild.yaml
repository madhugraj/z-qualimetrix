steps:
- name: 'node:22-alpine'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    apk add --no-cache dumb-init
    npm install --legacy-peer-deps
    npx prisma generate
    export NITRO_PRESET=node-server
    export VITE_API_URL=https://qubeiq.yavar.ai/api
    npm run build
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA', '-t', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:latest', '--build-arg=VITE_API_URL=https://qubeiq.yavar.ai/api', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:latest']
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['set', 'image', 'deployment/qualimetrix', 'qualimetrix=asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA', '-n', 'z-qualimetrix']
