# Template only — do NOT fill this in and commit it.
#
# Copy to k8s/secret.yaml (already gitignored), replace the placeholder
# values, then `kubectl apply -f k8s/secret.yaml`. Values are plain text
# under stringData; Kubernetes base64-encodes them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: qualimetrix-secrets
  namespace: qualimetrix
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/qualimetrix?schema=public"
  JWT_SECRET: "replace-with-a-long-random-string"
  JWT_REFRESH_SECRET: "replace-with-a-different-long-random-string"
  # openssl rand -base64 32
  ENCRYPTION_KEY: "replace-with-openssl-rand-base64-32-output"

  # --- Optional below, matching .env.example — uncomment what you use ---
  # REDIS_URL: "redis://HOST:6379"
  # GITHUB_TOKEN: "ghp_your_token_here"
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  # JIRA_CLIENT_ID: ""
  # JIRA_CLIENT_SECRET: ""
  # AZURE_DEVOPS_ORG_URL: ""
  # AZURE_DEVOPS_PAT: ""
