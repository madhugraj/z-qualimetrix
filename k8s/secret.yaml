apiVersion: v1
kind: Secret
metadata:
  name: qualimetrix-secrets
  namespace: z-qualimetrix
type: Opaque
stringData:
  # Database Connection String
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/qualimetrix?schema=public"

  # JWT Secrets — replaced with real generated values (2026-08-20). The API
  # now fails to boot if this is left at the old placeholder string, so this
  # is no longer optional.
  JWT_SECRET: "J6C4gzDvkBVU6KKv4FtRt7bsoyokz3IK2SdC9bkUnNQ="
  JWT_REFRESH_SECRET: "bVI3rVdOkHIcetQ/lSWYZCxk/gIalcbY89r9SZOda+c="

  # Redis Connection
  REDIS_URL: "redis://redis:6379"

  # Encryption Key — replaced with a real generated value (2026-08-20).
  ENCRYPTION_KEY: "Dy1uYeMleay8w0syQD2Bq/GvucbXFQHvPWt7+oOEruc="

  # Jira Cloud OAuth 2.0 (3LO) — fill in from developer.atlassian.com/console/myapps.
  # Callback URL registered on that app must be the JIRA_REDIRECT_URI in configmap.yaml.
  JIRA_CLIENT_ID: ""
  JIRA_CLIENT_SECRET: ""

  # Azure DevOps OAuth 2.0 — fill in from app.vssps.visualstudio.com/app/register
  # (the dedicated ADO OAuth app, not a general Entra ID/Azure AD app registration).
  AZURE_DEVOPS_CLIENT_ID: ""
  AZURE_DEVOPS_CLIENT_SECRET: ""

  # Optional: External Integration Keys
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  # GITHUB_TOKEN: ""