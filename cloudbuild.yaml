# Remote Cloud Build Configuration
# This fixes all RCA issues without local Docker building

steps:
# Build step with proper HTTPS URL
- name: 'node:22-alpine'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    echo "Building with VITE_API_URL=https://qubeiq.yavar.ai/api"
    apk add --no-cache openssl libc6-compat dumb-init
    npm install --legacy-peer-deps
    npx prisma generate
    export NITRO_PRESET=node-server
    export VITE_API_URL=https://qubeiq.yavar.ai/api
    npm run build
    echo "Build complete - assets should contain HTTPS URLs"

# Docker build with immutable tagging
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA',
         '-t', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:latest',
         '--build-arg=VITE_API_URL=https://qubeiq.yavar.ai/api',
         '.']

# Push both immutable and latest tags
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:latest']

# Deploy with immutable tag for traceability
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['set', 'image', 'deployment/qualimetrix',
         'qualimetrix=asia-south1-docker.pkg.dev/yavar-studio/yavar-platform/qualimetrix:$SHORT_SHA',
         '-n', 'z-qualimetrix']

# Force cache invalidation
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['annotate', 'deployment', 'qualimetrix',
         'build-id=$SHORT_SHA-$(date +%s)',
         '-n', 'z-qualimetrix', '--overwrite']

timeout: '1200s'
