apiVersion: v1
kind: Service
metadata:
  name: qualimetrix-service
  namespace: z-qualimetrix
  labels:
    app: qualimetrix
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: api
  selector:
    app: qualimetrix