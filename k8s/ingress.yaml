apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qualimetrix-route
  namespace: z-qualimetrix
spec:
  parentRefs:
  - name: platform-gateway
    namespace: envoy-gateway-system
  hostnames:
  - "qubeiq.yavar.ai"
  rules:
  # More specific /api prefix must come first — HTTPRoute matches in list
  # order, and the catch-all "/" rule below would otherwise shadow this one.
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: qualimetrix-service
      port: 3001
      kind: Service
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: qualimetrix-service
      port: 80
      kind: Service