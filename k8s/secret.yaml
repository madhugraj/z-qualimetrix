apiVersion: v1
kind: Secret
metadata:
  name: qualimetrix-secrets
  namespace: z-qualimetrix
type: Opaque
stringData:
  # Database Connection String
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/qualimetrix?schema=public"

  # JWT Secrets - CHANGE THESE IN PRODUCTION
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  JWT_REFRESH_SECRET: "your-super-secret-refresh-key-change-in-production"

  # Redis Connection
  REDIS_URL: "redis://redis:6379"

  # Encryption Key - GENERATE SECURE KEY FOR PRODUCTION
  ENCRYPTION_KEY: "your-super-secret-encryption-key-change-in-production-please-generate-secure-random-key"

  # Optional: External Integration Keys
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  # GITHUB_TOKEN: ""