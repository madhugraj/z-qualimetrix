apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: qualimetrix-route
  namespace: z-qualimetrix
spec:
  parentRefs:
  - name: platform-gateway
    namespace: envoy-gateway-system
  hostnames:
  - "qubeiq.yavar.ai"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: qualimetrix-service
      port: 80
      kind: Service